summary: Create a new contact
description: Creates a new contact for the authorized user. Accepts multipart form data including optional photo.
operationId: createContact
tags:
  - Contacts
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: John Doe
          phoneNumber:
            type: string
            example: '+380971234567'
          email:
            type: string
            example: john@example.com
          contactType:
            type: string
            enum: [work, home, personal]
            example: personal
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
            description: Contact photo
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    description: Invalid input data
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid contact data
  '401':
    description: Unauthorized access
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: Failed to create contact due to server error

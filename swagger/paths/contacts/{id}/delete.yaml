summary: Delete contact
description: Deletes a contact by its unique identifier. Requires authentication.
operationId: deleteContact
tags:
  - Contacts
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    description: Unique identifier of the contact to delete
    schema:
      type: string
      example: 670fd2b7e4c3a79b8a9a0a41
responses:
  '204':
    description: Contact deleted successfully
    content: {}
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found.
  '401':
    description: Unauthorized access
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: Failed to delete contact due to server error